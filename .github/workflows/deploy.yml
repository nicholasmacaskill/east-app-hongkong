name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: SUDO_PASS,SUPABASE_URL,GITHUB_TOKEN
          script: |
            set -ex
            cd /var/www/eastapp.booking.dynevents.com
            
            echo "🔄 User: $(whoami) | RAM Check: $(free -m | grep Mem)"
            
            # A. KILL PM2
            echo "🛑 Stopping and Killing all PM2 processes..."
            echo "$SUDO_PASS" | sudo -S pm2 delete EastApp || true
            
            # B. NUCLEAR PURGE
            echo "💣 DELETING EVERYTHING in target folder (Guaranteed)..."
            # Using find to delete everything except the actual directory itself
            echo "$SUDO_PASS" | sudo -S find . -mindepth 1 -delete
            
            # C. OWNERSHIP FIX
            echo "🔑 Ensuring $(whoami) owns $(pwd)..."
            echo "$SUDO_PASS" | sudo -S chown -R $(whoami):$(whoami) .
            
            # D. TOKEN-BASED CLONE (Bypasses SSH permission issues)
            echo "🔄 Fresh re-initialization (HTTPS Token Clone)..."
            # We use the token from env (passed via envs)
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/nicholasmacaskill/east-app-hongkong.git" .
            git checkout main
            
            # E. ENV SETUP
            BUILD_ID=$(date +%s)
            echo "📝 Creating fresh .env.production (Build ID: $BUILD_ID)..."
            echo "NODE_ENV=production" > .env.production
            echo "NEXT_PUBLIC_STRIPE_MODE=live" >> .env.production
            echo "NEXT_PUBLIC_BUILD_ID=$BUILD_ID" >> .env.production
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_LIVE }}" >> .env.production
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.production
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.production
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.production
            echo "NEXT_PUBLIC_BASE_URL=https://eastapp.booking.dynevents.com" >> .env.production

            # F. DEPENDENCIES
            echo "📦 Installing pnpm..."
            if ! command -v pnpm &> /dev/null; then
              echo "$SUDO_PASS" | sudo -S npm install -g pnpm
            fi

            echo "📦 Installing fresh dependencies..."
            pnpm install --no-lockfile
            
            # G. BUILD
            echo "🏗️ Building for LIVE mode..."
            NEXT_PUBLIC_STRIPE_MODE=live NODE_ENV=production pnpm build
            
            # H. STANDALONE PREP
            echo "📂 Preparing standalone directory..."
            mkdir -p .next/standalone/.next/static
            cp -rv .next/static/* .next/standalone/.next/static/
            cp -rv public .next/standalone/
            
            # I. LAUNCH
            echo "🚀 Launching via ecosystem.config.js..."
            echo "$SUDO_PASS" | sudo -S pm2 start ecosystem.config.js --only EastApp --update-env
            echo "$SUDO_PASS" | sudo -S pm2 save
            
            echo "📋 Recent Server Logs (Last 20 lines):"
            echo "$SUDO_PASS" | sudo -S pm2 logs EastApp --lines 20 --no-daemon &
            LOG_PID=$!
            sleep 15
            kill $LOG_PID || true
            
            echo "✅ FINAL NUCLEAR RESET COMPLETE!"
            pm2 list
