name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          envs: SUDO_PASS,SUPABASE_URL
          script: |
            set -e
            cd /var/www/eastapp.booking.dynevents.com
            
            echo "🔄 Fetching latest code and resetting local changes..."
            git fetch origin main
            git reset --hard origin/main
            
            # Validation: Fail early if critical secrets are missing from GitHub
            if [ -z "$SUPABASE_URL" ]; then
              echo "❌ ERROR: NEXT_PUBLIC_SUPABASE_URL secret is missing!"
              exit 1
            fi

            # Create/Update .env.production with latest secrets
            echo "📝 Updating .env.production..."
            echo "NEXT_PUBLIC_STRIPE_MODE=live" > .env.production
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_LIVE }}" >> .env.production
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_MONTHLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_YEARLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_STARTER=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_STANDARD=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STANDARD_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_PRO=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_ELITE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ELITE_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_MONTHLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_YEARLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_MONTHLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_YEARLY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.production
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.production
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.production
            echo "NEXT_PUBLIC_BASE_URL=https://eastapp.booking.dynevents.com" >> .env.production

            # Clean build cache using authenticated sudo
            echo "🧹 Cleaning .next directory (CurrentUser: $(whoami))..."
            echo "$SUDO_PASS" | sudo -S rm -rf .next
            
            # Ensure pnpm is available
            if ! command -v pnpm &> /dev/null; then
              echo "⚠️ pnpm not found. Installing..."
              echo "$SUDO_PASS" | sudo -S npm install -g pnpm
            fi

            echo "📦 Installing dependencies..."
            pnpm install --frozen-lockfile || pnpm install
            
            # Build for production with environment variables
            echo "🏗️ Building with NEXT_PUBLIC_STRIPE_MODE=live..."
            NEXT_PUBLIC_STRIPE_MODE=live pnpm build
            
            # Verify and copy assets into standalone bundle
            echo "📂 Copying static assets to standalone directory..."
            mkdir -p .next/standalone/.next/static
            cp -rv .next/static/* .next/standalone/.next/static/
            cp -rv public .next/standalone/
            
            # PM2 Restart - Explicit name matching
            echo "🚀 Restarting PM2 process 'EastApp'..."
            echo "$SUDO_PASS" | sudo -S pm2 delete EastApp || true
            echo "$SUDO_PASS" | sudo -S pm2 start node --name "EastApp" -- .next/standalone/server.js
            echo "$SUDO_PASS" | sudo -S pm2 save
            
            echo "✅ Deployment Complete!"
