name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            cd /var/www/eastapp.booking.dynevents.com
            git pull origin main
            
            # Validation: Fail early if critical secrets are missing from GitHub
            if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
              echo "❌ ERROR: NEXT_PUBLIC_SUPABASE_URL secret is missing!"
              exit 1
            fi

            # Create/Update .env.production with latest secrets
            cat <<EOF > .env.production
NEXT_PUBLIC_STRIPE_MODE=live
STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_LIVE }}
STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_MONTHLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_YEARLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_STARTER=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_STANDARD=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STANDARD_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_PRO=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_ELITE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ELITE_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ULTIMATE_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_MONTHLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_2_YEARLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_MONTHLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_MONTHLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_YEARLY=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_FAMILY_3_YEARLY_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE_LIVE }}
NEXT_PUBLIC_STRIPE_PRICE_TOPUP=${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_LIVE }}
NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
DATABASE_URL=${{ secrets.DATABASE_URL }}
RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
NEXT_PUBLIC_BASE_URL=https://eastapp.booking.dynevents.com
EOF

            # Clean build cache and install dependencies using pnpm
            sudo rm -rf .next
            
            # Ensure pnpm is available
            if ! command -v pnpm &> /dev/null; then
              echo "⚠️ pnpm not found. Installing..."
              npm install -g pnpm
            fi

            pnpm install --frozen-lockfile || pnpm install
            
            # Build for production
            pnpm build
            
            # Setup standalone directory
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/* .next/standalone/.next/static/
            cp -r public .next/standalone/
            
            # PM2 Restart with direct node execution for better stability with standalone
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 restart EastApp --update-env || \
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 start node --name "EastApp" -- .next/standalone/server.js
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 save
