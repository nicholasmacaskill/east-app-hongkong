name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          envs: SUDO_PASS,SUPABASE_URL
          script: |
            set -ex
            # 1. Stop PM2 first to free all handles
            echo "🛑 Stopping PM2..."
            echo "$SUDO_PASS" | sudo -S pm2 stop EastApp || true
            echo "$SUDO_PASS" | sudo -S pm2 delete EastApp || true
            
            # 2. Re-create the folder to ensure absolute clean state
            # (We go to /var/www to delete the contents of the target folder)
            cd /var/www/eastapp.booking.dynevents.com
            echo "🔄 User: $(whoami) | RAM Check: $(free -m | grep Mem) | Node: $(node -v)"
            
            echo "💣 NUCLEAR RESET: Purging all files..."
            echo "$SUDO_PASS" | sudo -H -S rm -rf .[^.]* * || true
            
            echo "🔄 Fresh re-initialization (re-cloning)..."
            git clone git@github.com:nicholasmacaskill/east-app-hongkong.git .
            git checkout main
            
            # Recreate .env.production with ALL essential keys
            BUILD_ID=$(date +%s)
            echo "📝 Creating fresh .env.production (Build ID: $BUILD_ID)..."
            echo "NODE_ENV=production" > .env.production
            echo "NEXT_PUBLIC_STRIPE_MODE=live" >> .env.production
            echo "NEXT_PUBLIC_BUILD_ID=$BUILD_ID" >> .env.production
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_LIVE }}" >> .env.production
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.production
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.production
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env.production
            echo "NEXT_PUBLIC_BASE_URL=https://eastapp.booking.dynevents.com" >> .env.production

            echo "📦 Installing pnpm..."
            if ! command -v pnpm &> /dev/null; then
              echo "$SUDO_PASS" | sudo -H -S npm install -g pnpm
            fi

            echo "📦 Installing dependencies (fresh)..."
            pnpm install --no-lockfile
            
            echo "🏗️ Building from zero-state..."
            # Using --no-lint and --ignore-build-errors for emergency recovery
            NEXT_PUBLIC_STRIPE_MODE=live NODE_ENV=production pnpm build
            
            echo "📂 Mirroring assets into standalone folder..."
            mkdir -p .next/standalone/.next/static
            cp -rv .next/static/* .next/standalone/.next/static/
            cp -rv public .next/standalone/
            
            echo "🚀 Orchestrating launch via ecosystem.config.js..."
            # ecosystem.config.js handles env_file and args correctly
            echo "$SUDO_PASS" | sudo -H -S pm2 start ecosystem.config.js --only EastApp --update-env
            echo "$SUDO_PASS" | sudo -H -S pm2 save
            
            echo "📋 Server Health Check (Logs):"
            echo "$SUDO_PASS" | sudo -H -S pm2 logs EastApp --lines 20 --no-daemon &
            LOG_PID=$!
            sleep 10
            kill $LOG_PID || true
            
            echo "✅ NUCLEAR RESET COMPLETE!"
            pm2 list
