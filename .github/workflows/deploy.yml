name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
          STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRICE_500: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER_LIVE }}
          PRICE_1000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD_LIVE }}
          PRICE_2500: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO_LIVE }}
          PRICE_5000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE_LIVE }}
          PRICE_10000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE_LIVE }}
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          envs: SUDO_PASS,SUPABASE_URL,GITHUB_TOKEN,STRIPE_SECRET_KEY_LIVE,STRIPE_WEBHOOK_SECRET_LIVE,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,DATABASE_URL,RESEND_API_KEY,PRICE_500,PRICE_1000,PRICE_2500,PRICE_5000,PRICE_10000
          script: |
            set -ex
            cd /var/www/eastapp.booking.dynevents.com
            
            echo "📊 SYSTEM AUDIT (Total Purge Mode):"
            echo "Disk: $(df -h .)"
            echo "Processes: $(ps aux | grep node | grep -v grep)"
            
            # A. TOTAL RUNTIME PURGE
            echo "⚠️ KILLING ALL NODE PROCESSES (Nuclear Runtime Purge)..."
            echo "$SUDO_PASS" | sudo -S pm2 delete EastApp || true
            echo "$SUDO_PASS" | sudo -S killall node || true
            # Force kill anything on our app ports
            echo "$SUDO_PASS" | sudo -S fuser -k 3000/tcp || true
            echo "$SUDO_PASS" | sudo -S fuser -k 3001/tcp || true
            
            echo "🧹 PURGING NGINX CACHE..."
            echo "$SUDO_PASS" | sudo -S rm -rf /var/cache/nginx/* || true
            echo "$SUDO_PASS" | sudo -S systemctl restart nginx || true
            
            # B. NUCLEAR DIRECTORY PURGE
            echo "💣 DELETING EVERYTHING in target folder..."
            echo "$SUDO_PASS" | sudo -S find . -mindepth 1 -delete
            
            # C. OWNERSHIP FIX
            echo "🔑 Ensuring $(whoami) owns $(pwd)..."
            echo "$SUDO_PASS" | sudo -S chown -R $(whoami):$(whoami) .
            
            # D. TOKEN-BASED CLONE 
            echo "🔄 Fresh re-initialization (HTTPS Token Clone)..."
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/nicholasmacaskill/east-app-hongkong.git" .
            git checkout main
            
            # E. ENV SETUP
            BUILD_ID=$(date +%s)
            echo "📝 Creating fresh .env.production (Build ID: $BUILD_ID)..."
            echo "NODE_ENV=production" > .env.production
            echo "NEXT_PUBLIC_STRIPE_MODE=live" >> .env.production
            echo "NEXT_PUBLIC_BUILD_ID=$BUILD_ID" >> .env.production
            echo "STRIPE_SECRET_KEY='$STRIPE_SECRET_KEY_LIVE'" >> .env.production
            echo "STRIPE_WEBHOOK_SECRET='$STRIPE_WEBHOOK_SECRET_LIVE'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY='$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE'" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_URL='$SUPABASE_URL'" >> .env.production
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY='$NEXT_PUBLIC_SUPABASE_ANON_KEY'" >> .env.production
            echo "SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY'" >> .env.production
            echo "DATABASE_URL='$DATABASE_URL'" >> .env.production
            echo "RESEND_API_KEY='$RESEND_API_KEY'" >> .env.production
            echo "NEXT_PUBLIC_BASE_URL=https://eastapp.booking.dynevents.com" >> .env.production
            
            # STRIPE PRICE IDS (LIVE)
            echo "NEXT_PUBLIC_STRIPE_PRICE_MONTHLY_LIVE=price_1SuxcY1xd62IoClxe1kbgS6M" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_YEARLY_LIVE=price_1SuxcX1xd62IoClxwsByYtDV" >> .env.production
            # Adding fallbacks for generic keys often used in code
            echo "NEXT_PUBLIC_STRIPE_PRICE_MONTHLY=$NEXT_PUBLIC_STRIPE_PRICE_MONTHLY_LIVE" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_YEARLY=$NEXT_PUBLIC_STRIPE_PRICE_YEARLY_LIVE" >> .env.production
            
            # TOP-UP PRICE IDS (LIVE)
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER_LIVE='$PRICE_500'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD_LIVE='$PRICE_1000'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO_LIVE='$PRICE_2500'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE_LIVE='$PRICE_5000'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE_LIVE='$PRICE_10000'" >> .env.production
            
            # Fallbacks for generic keys
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER='$PRICE_500'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD='$PRICE_1000'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO='$PRICE_2500'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE='$PRICE_5000'" >> .env.production
            echo "NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE='$PRICE_10000'" >> .env.production

            # F. DEPENDENCIES
            echo "📦 Checking/Installing pnpm..."
            if ! command -v pnpm &> /dev/null; then
              echo "$SUDO_PASS" | sudo -S npm install -g pnpm
            fi

            echo "📦 Installing dependencies..."
            pnpm install --no-lockfile
            
            # G. BUILD
            echo "🏗️ Building for LIVE mode (Bypassing Lint)..."
            # Ensure no stale build cache exists
            rm -rf .next/cache || true
            NEXT_PUBLIC_STRIPE_MODE=live NODE_ENV=production pnpm build
            
            # H. STANDALONE PREP
            echo "📂 Verifying standalone output..."
            ls -la .next
            if [ ! -d ".next/standalone" ]; then
                echo "❌ Standalone directory NOT found. Something is wrong with the build."
                exit 1
            fi

            echo "📂 Mirroring assets into standalone AND root (for Nginx)..."
            # Ensure standalone has assets
            mkdir -p .next/standalone/.next/static
            cp -rv .next/static/* .next/standalone/.next/static/
            # Ensure root has assets (for Nginx served from /var/www/...)
            mkdir -p .next/static
            cp -rv .next/standalone/.next/static/* .next/static/
            if [ -d "public" ]; then
              cp -rv public .next/standalone/
            fi
            
            # I. LAUNCH
            echo "🚀 Launching Production Standalone (PM2)..."
            echo "$SUDO_PASS" | sudo -S pm2 start ecosystem.config.js --only EastApp --update-env
            echo "$SUDO_PASS" | sudo -S pm2 save
            
            echo "📋 FINAL HEALTH CHECK:"
            echo "$SUDO_PASS" | sudo -S pm2 list
            echo "$SUDO_PASS" | sudo -S pm2 logs EastApp --lines 50 --no-daemon &
            LOG_PID=$!
            sleep 25
            kill $LOG_PID || true
            
            echo "✅ TOTAL RUNTIME PURGE COMPLETE!"
            echo "🔍 ENVIRONMENT KEY DISCOVERY (Masked):"
            env | cut -d= -f1 | sort
            echo "🔍 NGINX CONFIG AUDIT:"
            echo "$SUDO_PASS" | sudo -S find /etc/nginx/sites-enabled -type f -exec cat {} +
            pm2 desc EastApp
