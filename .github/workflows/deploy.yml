# Deploy Live Mode to Singapore VPS (Zero-CPU Build Mode)
# Off-Server Build Strategy: Build on GitHub Runner, Sync only artifacts to VPS.

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build Standalone (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_STRIPE_MODE: live
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Prepare Standalone Bundle
        run: |
          mkdir -p deploy_bundle
          cp -r .next/standalone/* deploy_bundle/
          mkdir -p deploy_bundle/.next/static
          cp -r .next/static/* deploy_bundle/.next/static/
          cp -r public deploy_bundle/
          # Include ecosystem file for PM2
          cp ecosystem.config.js deploy_bundle/
          # Create a compressed tarball for fast transfer
          tar -czf bundle.tar.gz -C deploy_bundle .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle
          path: bundle.tar.gz
          retention-days: 1

  deploy-live:
    name: 🚀 Deploy to VPS (Sync)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-bundle

      - name: Upload Bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          source: "bundle.tar.gz"
          target: "/var/www/eastapp.booking.dynevents.com"

      - name: Finalize & Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          STRIPE_SECRET_KEY_LIVE: ${{ secrets.STRIPE_SECRET_KEY_LIVE }}
          STRIPE_WEBHOOK_SECRET_LIVE: ${{ secrets.STRIPE_WEBHOOK_SECRET_LIVE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRICE_500: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STARTER_LIVE }}
          PRICE_1000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_STANDARD_LIVE }}
          PRICE_2500: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_PRO_LIVE }}
          PRICE_5000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ELITE_LIVE }}
          PRICE_10000: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_TOPUP_ULTIMATE_LIVE }}
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          envs: SUDO_PASS,STRIPE_SECRET_KEY_LIVE,STRIPE_WEBHOOK_SECRET_LIVE,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,DATABASE_URL,RESEND_API_KEY,PRICE_500,PRICE_1000,PRICE_2500,PRICE_5000,PRICE_10000
          script: |
            set -ex
            cd /var/www/eastapp.booking.dynevents.com
            
            # 1. Unpack the bundle
            echo "📦 Unpacking bundle..."
            tar -xzf bundle.tar.gz -C .
            rm bundle.tar.gz
            
            # 2. Env Setup (Still needed for the standalone server)
            echo "📝 Creating .env.production..."
            write_env() {
              printf '%s=%q\n' "$1" "$2" >> .env.production
            }
            echo "NODE_ENV=production" > .env.production
            echo "NEXT_PUBLIC_STRIPE_MODE=live" >> .env.production
            write_env "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY_LIVE"
            write_env "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET_LIVE"
            write_env "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE"
            write_env "NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_URL"
            write_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            write_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            write_env "DATABASE_URL" "$DATABASE_URL"
            write_env "RESEND_API_KEY" "$RESEND_API_KEY"
            
            # 3. Nginx Asset Alignment (Mirroring what was in G before)
            # We already unzipped into the root, which includes public/ and .next/static/
            # Nginx usually looks for these in the root or /public
            
            # 4. Launch (PM2)
            echo "🚀 Restarting EastApp (Minimal CPU Impact)..."
            echo "$SUDO_PASS" | sudo -S pm2 delete EastApp || true
            echo "$SUDO_PASS" | sudo -S pm2 start ecosystem.config.js --only EastApp --update-env
            echo "$SUDO_PASS" | sudo -S pm2 save
            
            echo "✅ ZERO-CPU DEPLOY COMPLETE!"

      - name: 🔍 Agentic Verification (Post-Deploy)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://eastapp.booking.dynevents.com
        run: |
          echo "🏁 Deployment verified! Starting sanity agent..."
          node scripts/deploy-verify.js
