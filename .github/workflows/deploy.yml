name: Deploy Live Mode to Singapore VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
            cd /var/www/eastapp.booking.dynevents.com
            git pull origin main
            # Clean build cache to prevent Server Action ID mismatch
            sudo rm -rf .next
            npm install
            NEXT_PUBLIC_STRIPE_MODE=live npm run build
            # Robust restart: Update env and handle missing process cases
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 restart EastApp --update-env || echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 start npm --name "EastApp" -- start
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S pm2 save
