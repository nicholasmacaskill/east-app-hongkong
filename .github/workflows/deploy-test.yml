# Deploy Test Mode to Singapore VPS (Zero-CPU Build Mode)

on:
  push:
    branches:
      - test

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build Standalone (Test)
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_STRIPE_MODE: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST || secrets.DATABASE_URL }}

      - name: Prepare Standalone Bundle
        run: |
          mkdir -p deploy_bundle
          cp -r .next/standalone/* deploy_bundle/
          mkdir -p deploy_bundle/.next/static
          cp -r .next/static/* deploy_bundle/.next/static/
          cp -r public deploy_bundle/
          cp ecosystem.config.js deploy_bundle/
          tar -czf bundle-test.tar.gz -C deploy_bundle .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-bundle-test
          path: bundle-test.tar.gz
          retention-days: 1

  deploy-test:
    name: 🚀 Deploy to VPS (Test Sync)
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-bundle-test

      - name: Upload Bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          source: "bundle-test.tar.gz"
          target: "/var/www/test.eastapp.booking.dynevents.com"

      - name: Finalize & Restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUDO_PASS: ${{ secrets.SUDO_PASSWORD }}
          STRIPE_SECRET_KEY_TEST: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET_TEST: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST || secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          envs: SUDO_PASS,STRIPE_SECRET_KEY_TEST,STRIPE_WEBHOOK_SECRET_TEST,NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,DATABASE_URL_TEST,RESEND_API_KEY
          script: |
            set -ex
            cd /var/www/test.eastapp.booking.dynevents.com
            
            echo "📦 Unpacking bundle..."
            tar -xzf bundle-test.tar.gz -C .
            rm bundle-test.tar.gz
            
            echo "📝 Creating .env.test..."
            write_env() {
              printf '%s=%q\n' "$1" "$2" >> .env.test
            }
            echo "NODE_ENV=production" > .env.test
            echo "NEXT_PUBLIC_STRIPE_MODE=test" >> .env.test
            write_env "STRIPE_SECRET_KEY" "$STRIPE_SECRET_KEY_TEST"
            write_env "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET_TEST"
            write_env "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST"
            write_env "NEXT_PUBLIC_SUPABASE_URL" "$NEXT_PUBLIC_SUPABASE_URL"
            write_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            write_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            write_env "DATABASE_URL" "$DATABASE_URL_TEST"
            write_env "RESEND_API_KEY" "$RESEND_API_KEY"
            
            echo "🚀 Restarting EastAppTest (Minimal CPU Impact)..."
            echo "$SUDO_PASS" | sudo -S pm2 delete EastAppTest || true
            echo "$SUDO_PASS" | sudo -S pm2 start ecosystem.config.js --only EastAppTest --update-env
            echo "$SUDO_PASS" | sudo -S pm2 save
            
            echo "✅ ZERO-CPU TEST DEPLOY COMPLETE!"

      - name: 🔍 Agentic Verification (Post-Deploy)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_BASE_URL: https://test.eastapp.booking.dynevents.com
        run: |
          echo "🏁 Deployment verified! Starting sanity agent..."
          node scripts/deploy-verify.js
