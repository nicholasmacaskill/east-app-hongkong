name: Server Diagnostics
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Remote Diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
             echo "🔌 NETWORK PORTS:"
             sudo netstat -tulpn | grep LISTEN
             echo "🌐 NGINX CONFIG (test):"
             sudo cat /etc/nginx/sites-enabled/test.eastapp.booking.dynevents.com
             echo "📂 FILES IN TEST BUNDLE:"
             ls -R /var/www/test.eastapp.booking.dynevents.com/.next/server/app/sys-admin
             echo "🕒 DEPLOY BREADCRUMB:"
             cat /var/www/test.eastapp.booking.dynevents.com/DEPLOYED_AT.txt
