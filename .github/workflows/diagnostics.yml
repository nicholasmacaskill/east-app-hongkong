name: Server Diagnostics
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Run Remote Diagnostics
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dyn1.dynevents.com
          username: nicholas
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 60022
          script: |
             echo "🔌 NETWORK PORTS:"
             sudo netstat -tulpn | grep LISTEN
             echo "🌐 NGINX CONFIG (test):"
             cat /etc/nginx/sites-enabled/* | grep -A 50 "test.eastapp" || echo "Config not found"
             
             echo "🔍 HTML SOURCE (test):"
             curl -v http://localhost:3001/sys-admin/tickets 2>&1 | head -n 100
             
             echo "📂 FILES IN TEST BUNDLE:"
             ls -R /var/www/test.eastapp.booking.dynevents.com/.next/server/app/sys-admin
             echo "🕒 DEPLOY BREADCRUMB:"
             cat /var/www/test.eastapp.booking.dynevents.com/DEPLOYED_AT.txt
